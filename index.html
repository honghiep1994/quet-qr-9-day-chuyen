<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Quét QR cấp nguyên liệu 9 DC</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>body{margin:0;background:#edf3f7;color:#17365d;font-family:Arial,sans-serif}main{max-width:560px;margin:auto;padding:18px;background:white;min-height:100vh;box-sizing:border-box}h2{text-align:center}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.dc{padding:18px 6px;border:1px solid #a8bfd0;border-radius:9px;background:#eaf1f8;font-size:18px;font-weight:bold;color:#17365d}.dc.active{background:#176b42;color:white}.btn{padding:15px;width:100%;background:#176b42;color:white;border:0;border-radius:9px;font-size:17px;font-weight:bold;margin:12px 0}.btn:disabled{opacity:.55}label{display:block;font-weight:bold;margin:18px 0 8px}input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #b7c8d8;border-radius:8px;font-size:18px}#reader{margin-top:10px}#status{white-space:pre-wrap;line-height:1.5}.warn{background:#ffe8e8;color:#8d1c1c;padding:12px;border-radius:8px}.note{font-size:14px;color:#5b6e7c;line-height:1.5}</style></head><body><main>
<h2>QUÉT QR CẤP NGUYÊN LIỆU</h2><p class="note">Chọn dây chuyền trước, sau đó hướng camera vào mã QR. Mỗi lần quét sẽ chuyển sang trang xác nhận an toàn của Google.</p>
<label>1. Chọn dây chuyền</label><div id="lines" class="grid"></div>
<label>2. Quét mã QR trực tiếp</label><button class="btn" id="start">BẬT CAMERA QUÉT QR</button><button class="btn" id="stop" style="background:#687989" disabled>DỪNG CAMERA</button><div id="reader"></div>
<label>3. Dự phòng: nhập mã bằng tay</label><input id="manual" placeholder="Ví dụ: 001245" maxlength="100" autocomplete="off"><button class="btn" id="manualGo">CHUYỂN SANG XÁC NHẬN</button>
<p id="status" role="status" class="note"></p><p class="note">Trang quét này không yêu cầu mật khẩu kho. Mật khẩu chỉ nhập tại trang xác nhận Google Apps Script. Không sử dụng trang trên HTTP.</p>
</main><script>
// THAY ĐỊA CHỈ DƯỚI ĐÂY bằng URL ứng dụng web Apps Script kết thúc bằng /exec.
const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycby9d-EKIJCLGmzOF-mcBFRVVrr5YGs6Ohhkt6mV9jdvxyG-m4suEKwyXPFJL7gdZhk/exec';
const $=id=>document.getElementById(id);let dc=(/^DC0[1-9]$/.test(new URLSearchParams(location.search).get('dc')||'')?new URLSearchParams(location.search).get('dc'):localStorage.getItem('qr_dc'))||'DC01',reader=null,scanning=false,transitioning=false;
const validCode=x=>/^[A-Za-z0-9]{1,100}$/.test(x);
function status(s,bad=false){$('status').textContent=s;$('status').className=bad?'warn':'note';}
function draw(){ $('lines').innerHTML='';for(let i=1;i<=9;i++){const name='DC'+String(i).padStart(2,'0');const b=document.createElement('button');b.className='dc'+(dc===name?' active':'');b.textContent=name;b.onclick=()=>{dc=name;localStorage.setItem('qr_dc',dc);draw()};$('lines').appendChild(b)}}draw();localStorage.setItem('qr_dc',dc);
function go(raw){if(transitioning)return;const ma=String(raw||'').trim();if(!validCode(ma)){status('Mã QR không hợp lệ. Chỉ chấp nhận chữ và số, tối đa 100 ký tự.',true);return;}if(!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(WEB_APP_URL)){status('Chưa cấu hình URL Apps Script /exec trong scanner.html.',true);return;}transitioning=true;status('Đã đọc mã '+ma+'. Đang chuyển đến trang xác nhận...');const url=WEB_APP_URL+'?dc='+encodeURIComponent(dc)+'&ma='+encodeURIComponent(ma);window.location.assign(url)}
$('manualGo').onclick=()=>go($('manual').value);
$('start').onclick=async()=>{if(scanning)return;if(typeof Html5Qrcode==='undefined'){status('Không tải được thư viện quét QR. Kiểm tra kết nối mạng.',true);return;}reader=new Html5Qrcode('reader');try{await reader.start({facingMode:'environment'},{fps:10,qrbox:{width:240,height:240}},decoded=>{if(transitioning)return;go(decoded)},()=>{});scanning=true;$('start').disabled=true;$('stop').disabled=false;status('Camera đã mở. Đưa mã QR vào khung hình.')}catch(e){status('Không mở được camera: '+(e&&e.message||e)+'\nHãy mở trang HTTPS bằng Safari/Chrome và cho phép Camera.',true)}};
$('stop').onclick=async()=>{if(!reader||!scanning)return;try{await reader.stop();reader.clear()}catch(e){}scanning=false;$('start').disabled=false;$('stop').disabled=true;status('Đã dừng camera.')};
</script></body></html>
