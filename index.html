<!doctype html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Quét QR cấp nguyên liệu</title><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><style>
body{margin:0;background:#edf3f7;color:#17365d;font:16px Arial,sans-serif}main{max-width:560px;margin:auto;padding:18px;background:white;min-height:100vh;box-sizing:border-box}h2{text-align:center;font-size:21px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.dc{padding:16px 5px;border:1px solid #a8bfd0;border-radius:9px;background:#eaf1f8;font-size:18px;font-weight:bold;color:#17365d}.dc.active{background:#176b42;color:white}.btn{padding:15px;width:100%;background:#176b42;color:white;border:0;border-radius:9px;font-size:17px;font-weight:bold;margin:9px 0}.btn:disabled{opacity:.5}label{display:block;font-weight:bold;margin:15px 0 8px}input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #b7c8d8;border-radius:8px;font-size:17px}#reader{margin-top:10px}#status{white-space:pre-wrap;line-height:1.5;padding:10px;border-radius:8px}.warn{background:#ffe8e8;color:#8d1c1c}.success{background:#e0f5e9;color:#176b42}.note{font-size:14px;color:#5b6e7c;line-height:1.5}#confirm{display:none;background:#eef4f9;padding:14px;border-radius:10px;margin:15px 0}#confirm strong{overflow-wrap:anywhere}#transport{display:none}
</style></head><body><main><h2>QUÉT QR CẤP NGUYÊN LIỆU</h2><p class="note">Chọn dây chuyền, quét QR, nhấn CẬP NHẬT. Ghi thành công sẽ tự quét tiếp, không mở tab mới.</p><label>1. Chọn dây chuyền</label><div id="lines" class="grid"></div><label>2. Người xuất (nhập một lần)</label><input id="person" placeholder="Họ tên nhân viên" maxlength="100" autocomplete="name"><label>3. Quét mã QR</label><button class="btn" id="start">BẬT CAMERA QUÉT QR</button><button class="btn" id="stop" style="background:#687989" disabled>DỪNG CAMERA</button><div id="reader"></div><div id="confirm"><div>Dây chuyền: <strong id="chosenDc"></strong></div><div>Mã nguyên liệu: <strong id="chosenCode"></strong></div><button class="btn" id="save">CẬP NHẬT</button><button class="btn" id="cancel" style="background:#687989">QUÉT LẠI</button></div><label>Dự phòng: nhập mã bằng tay</label><input id="manual" placeholder="Ví dụ: 001245" maxlength="100" autocomplete="off"><button class="btn" id="manualGo">XÁC NHẬN MÃ NHẬP TAY</button><p id="status" class="note" role="status" aria-live="polite"></p><p class="note">Chỉ cấp nguyên liệu khi hiện thông báo ĐÃ GHI NHẬN. Nếu mất mạng hoặc hết thời gian chờ, hãy kiểm tra dữ liệu trước khi thử lại.</p><iframe id="transport" name="transport"></iframe></main><script>
const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycby9d-EKIJCLGmzOF-mcBFRVVrr5YGs6Ohhkt6mV9jdvxyG-m4suEKwyXPFJL7gdZhk/exec';
const $=id=>document.getElementById(id);
const validCode=x=>/^[A-Za-z0-9]{1,100}$/.test(x);
let dc=localStorage.getItem('qr_dc')||'DC01',reader=null,scanning=false,busy=false,pending='',request=null;
let pollingTimer=null;
if(!/^DC0[1-9]$/.test(dc))dc='DC01';
$('person').value=localStorage.getItem('qr_person')||'';
$('person').addEventListener('change',()=>localStorage.setItem('qr_person',$('person').value.trim()));
function status(s,kind='note'){$('status').textContent=s;$('status').className=kind;}
function draw(){ $('lines').innerHTML='';for(let i=1;i<=9;i++){const name='DC'+String(i).padStart(2,'0');const b=document.createElement('button');b.className='dc'+(dc===name?' active':'');b.textContent=name;b.disabled=busy||!!pending;b.onclick=()=>{dc=name;localStorage.setItem('qr_dc',dc);draw()};$('lines').appendChild(b)}}draw();
async function stopCamera(){if(!reader||!scanning)return;try{await reader.stop();reader.clear()}catch(e){}scanning=false;$('start').disabled=false;$('stop').disabled=true;}
async function startCamera(){if(scanning||busy||pending)return;if(typeof Html5Qrcode==='undefined'){status('Không tải được thư viện quét QR.','warn');return;}try{reader=new Html5Qrcode('reader');await reader.start({facingMode:'environment'},{fps:10,qrbox:{width:240,height:240}},code=>{if(!busy&&!pending)choose(code)},()=>{});scanning=true;$('start').disabled=true;$('stop').disabled=false;status('Camera đã mở. Đưa mã QR vào khung hình.')}catch(e){status('Không mở được camera: '+(e.message||e),'warn')}}
async function choose(value){const code=String(value||'').trim();if(!validCode(code)){status('Mã QR không hợp lệ.','warn');return;}if(pending||busy)return;pending=code;$('chosenDc').textContent=dc;$('chosenCode').textContent=code;$('confirm').style.display='block';draw();await stopCamera();status('Đã quét '+code+'. Kiểm tra và nhấn CẬP NHẬT.');}
async function reset(message,kind='note'){pending='';busy=false;$('confirm').style.display='none';$('manual').value='';$('save').disabled=false;$('cancel').disabled=false;draw();status(message,kind);await startCamera();if(message)status(message,kind);}
function sendForm(payload){const form=document.createElement('form');form.method='POST';form.action=WEB_APP_URL;form.target='transport';form.style.display='none';for(const [key,value] of Object.entries(payload)){const field=document.createElement('input');field.name=key;field.value=value;form.appendChild(field);}document.body.appendChild(form);form.submit();form.remove();}
function checkRecorded(req){
  if(!request||request.id!==req.id)return;
  const cb='qrCallback_'+req.id.replace(/-/g,'_');
  const script=document.createElement('script');
  const cleanup=()=>{script.remove();delete window[cb]};
  window[cb]=async result=>{
    cleanup();
    if(!request||request.id!==req.id)return;
    if(result&&result.found){
      request=null;clearTimeout(pollingTimer);
      await reset('ĐÃ GHI NHẬN THÀNH CÔNG — '+result.ma+' / '+result.dc,'success');
    }else if(Date.now()-req.started<45000){
      pollingTimer=setTimeout(()=>checkRecorded(req),2500);
    }else{
      busy=false;$('save').disabled=true;$('cancel').disabled=false;draw();
      status('CHƯA XÁC MINH ĐƯỢC kết quả. Kiểm tra Google Sheets trước khi thao tác tiếp. Không nhấn CẬP NHẬT lần nữa.','warn');
    }
  };
  script.onerror=()=>{cleanup();if(request&&request.id===req.id){if(Date.now()-req.started<45000)pollingTimer=setTimeout(()=>checkRecorded(req),3000);else{busy=false;$('save').disabled=true;$('cancel').disabled=false;status('Không kiểm tra được trạng thái máy chủ. Hãy xem Google Sheets.','warn');}}};
  script.src=WEB_APP_URL+'?callback='+encodeURIComponent(cb)+'&id='+encodeURIComponent(req.id)+'&_='+Date.now();
  document.head.appendChild(script);
}
$('save').onclick=()=>{
  if(!pending||busy||request)return;
  const person=$('person').value.trim();
  if(!person||person.length>100||/[\x00-\x1f]/.test(person)){status('Nhập tên người xuất hợp lệ.','warn');$('person').focus();return;}
  localStorage.setItem('qr_person',person);
  busy=true;draw();$('save').disabled=true;$('cancel').disabled=true;
  const id=crypto.randomUUID?crypto.randomUUID():String(Date.now())+'-'+Math.random().toString(36).slice(2);
  request={id,code:pending,dc,started:Date.now()};
  status('Đang ghi nhận và kiểm tra kết quả trên Google Sheets...');
  sendForm({id,ma:pending,dc,nguoi:person});
  pollingTimer=setTimeout(()=>checkRecorded(request),2000);
};
$('cancel').onclick=()=>{request=null;clearTimeout(pollingTimer);reset('Sẵn sàng quét mã tiếp theo.')};$('manualGo').onclick=()=>choose($('manual').value);$('start').onclick=startCamera;$('stop').onclick=()=>stopCamera().then(()=>status('Đã dừng camera.'));
</script></body></html>
