<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Quét QR cấp nguyên liệu - V8</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#edf3f7;color:#17365d;font:16px Arial,sans-serif}
    main{max-width:560px;margin:auto;padding:16px;background:#fff;min-height:100vh}
    h2{text-align:center;font-size:21px;margin:10px 0 16px}.sub{font-size:13px;color:#587085;line-height:1.55}
    label{display:block;font-weight:bold;margin:16px 0 8px}
    input{width:100%;padding:13px;border:1px solid #b7c8d8;border-radius:9px;font-size:17px}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
    .dc{border:1px solid #a8bfd0;border-radius:9px;background:#eaf1f8;padding:15px 4px;color:#17365d;font:bold 18px Arial}
    .dc.active{background:#176b42;color:#fff}.dc:disabled{opacity:.55}
    .btn{display:block;width:100%;padding:14px;margin:9px 0;border:0;border-radius:9px;background:#176b42;color:white;font:bold 17px Arial}
    .btn.muted{background:#667b8b}.btn:disabled{opacity:.48}
    #reader{margin:12px 0;border-radius:10px;overflow:hidden}
    #confirm{display:none;background:#edf3f9;border-radius:11px;padding:15px;margin:16px 0;line-height:1.65}
    #confirm strong{overflow-wrap:anywhere}
    #status{white-space:pre-wrap;line-height:1.55;border-radius:9px;padding:12px;margin:15px 0;font-size:15px}
    .note{background:#eef3f7;color:#466176}.success{background:#dff6e8;color:#12653b}
    .warn{background:#ffe6e6;color:#9b2020}.wait{background:#fff4df;color:#795216}
    .small{font-size:13px;color:#607486}#postFrame{display:none}
    #server{font-size:13px;margin:12px 0;padding:9px;border-radius:8px;background:#edf3f7;color:#4a6476}
  </style>
</head>
<body>
<main>
  <h2>QUÉT QR CẤP NGUYÊN LIỆU · V8</h2>
  <div id="server" role="status">Đang kiểm tra kết nối máy chủ...</div>
  <label>1. Chọn dây chuyền</label><div class="grid" id="lines"></div>
  <label for="person">2. Người xuất (nhập một lần)</label>
  <input id="person" placeholder="Họ tên người xuất" maxlength="100" autocomplete="name">
  <label>3. Quét mã QR</label>
  <button class="btn" id="start" type="button">BẬT CAMERA QUÉT QR</button>
  <button class="btn muted" id="stop" type="button" disabled>DỪNG CAMERA</button>
  <div id="reader"></div>
  <div id="confirm">
    <div>Dây chuyền: <strong id="chosenDc"></strong></div>
    <div>Mã nguyên liệu: <strong id="chosenCode"></strong></div>
    <button class="btn" id="save" type="button">CẬP NHẬT</button>
    <button class="btn muted" id="cancel" type="button">QUÉT LẠI</button>
    <button class="btn muted" id="recheck" type="button" style="display:none">KIỂM TRA LẠI GIAO DỊCH (KHÔNG GHI LẠI)</button>
    <button class="btn muted" id="abandon" type="button" style="display:none">ĐÃ KIỂM TRA SHEETS – ĐÓNG GIAO DỊCH</button>
  </div>
  <label for="manual">Dự phòng: nhập mã bằng tay</label>
  <input id="manual" placeholder="Ví dụ: 001245" maxlength="100" autocomplete="off">
  <button class="btn" id="manualGo" type="button">XÁC NHẬN MÃ NHẬP TAY</button>
  <p id="status" class="note" role="status" aria-live="polite">Bật camera một lần để quét liên tục.</p>
  <button class="btn muted" id="ping" type="button">KIỂM TRA KẾT NỐI MÁY CHỦ</button>
  <p class="small">Chỉ cấp nguyên liệu khi nhận thông báo ĐÃ GHI NHẬN. Nếu chưa xác minh được, phải kiểm tra Google Sheets trước khi tiếp tục.</p>
  <iframe id="postFrame" name="qrPostFrame" title="Kết nối máy chủ"></iframe>
</main>
<script>
'use strict';
const WEB_APP_URL='https://script.google.com/macros/s/AKfycby9d-EKIJCLGmzOF-mcBFRVVrr5YGs6Ohhkt6mV9jdvxyG-m4suEKwyXPFJL7gdZhk/exec';
const EXPECTED_VERSION='QR-V8-20261017';
const $=id=>document.getElementById(id);
const validCode=x=>/^[A-Za-z0-9]{1,100}$/.test(x);
const validLine=x=>/^DC0[1-9]$/.test(x);
let dc=localStorage.getItem('qr_dc')||'DC01';if(!validLine(dc))dc='DC01';
let reader=null,scanning=false,cameraStarting=false,ready=false,pending='',busy=false;
let request=null,lastHandledCode='',suppressLast=false,videoRecovering=false;
const activeChecks=new Set();
$('person').value=localStorage.getItem('qr_person')||'';
$('person').addEventListener('change',()=>localStorage.setItem('qr_person',$('person').value.trim()));
function setStatus(s,kind='note'){$('status').textContent=s;$('status').className=kind;}
function draw(){
  $('lines').replaceChildren();
  for(let i=1;i<=9;i++){
    const line='DC'+String(i).padStart(2,'0'),btn=document.createElement('button');
    btn.type='button';btn.className='dc'+(dc===line?' active':'');btn.textContent=line;
    btn.disabled=!!pending||busy;
    btn.onclick=()=>{dc=line;localStorage.setItem('qr_dc',dc);draw()};
    $('lines').appendChild(btn);
  }
}
draw();
function setServer(s,ok){$('server').textContent=s;$('server').style.color=ok?'#176b42':'#9b2020'}
function jsonp(action,params={},timeoutMs=9000){
  return new Promise((resolve,reject)=>{
    const callback='qrCallback_'+(crypto.randomUUID?crypto.randomUUID().replace(/-/g,'_'):'q'+Date.now()+'_'+Math.random().toString(36).slice(2));
    const script=document.createElement('script');
    let done=false,timer;
    const cleanup=()=>{clearTimeout(timer);script.remove();delete window[callback];activeChecks.delete(cleanup)};
    const finish=(error,value)=>{if(done)return;done=true;cleanup();error?reject(error):resolve(value)};
    activeChecks.add(cleanup);
    window[callback]=result=>finish(null,result);
    script.onerror=()=>finish(new Error('Không tải được phản hồi từ Apps Script'));
    // Script tải xong nhưng không gọi callback thường là lỗi triển khai/đăng nhập/API cũ.
    script.onload=()=>{if(!done)finish(new Error('Máy chủ không trả dữ liệu JSONP hợp lệ'))};
    timer=setTimeout(()=>finish(new Error('Máy chủ không phản hồi trong '+Math.round(timeoutMs/1000)+' giây')),timeoutMs);
    const qs=new URLSearchParams({action,callback,...params,_:Date.now().toString()});
    script.src=WEB_APP_URL+'?'+qs.toString();
    document.head.appendChild(script);
  });
}
async function ping(){
  $('ping').disabled=true;ready=false;
  setServer('Đang kiểm tra kết nối máy chủ...',false);
  try{
    const result=await jsonp('ping',{},12000);
    if(!result||result.version!==EXPECTED_VERSION||result.ok!==true)
      throw new Error('Apps Script chưa triển khai đúng phiên bản V8.');
    ready=true;setServer('✓ Máy chủ đã kết nối — '+result.version,true);
    if(!pending&&!busy)setStatus('Máy chủ đã sẵn sàng. Quét QR và nhấn CẬP NHẬT.','note');
  }catch(e){setServer('✕ Chưa kết nối API V8: '+(e.message||e),false);setStatus('Chưa thể xác nhận máy chủ. Không cập nhật mã mới cho tới khi kết nối thành công.','warn')}
  finally{$('ping').disabled=false}
}
$('ping').onclick=ping;
function liveVideo(){const video=$('reader').querySelector('video');return !!(video&&video.srcObject&&video.srcObject.getVideoTracks().some(t=>t.readyState==='live')&&!video.paused)}
async function startCamera(){
  if(scanning||cameraStarting)return;
  if(typeof Html5Qrcode==='undefined'){setStatus('Không tải được thư viện camera. Kiểm tra kết nối mạng.','warn');return}
  cameraStarting=true;$('start').disabled=true;
  try{
    reader=new Html5Qrcode('reader');
    await reader.start({facingMode:'environment'},{fps:10,qrbox:{width:240,height:240}},code=>{
      if(!pending&&!busy&&!request)choose(code);
    },()=>{});
    scanning=true;$('stop').disabled=false;
    if(!pending&&!busy)setStatus('Camera đang hoạt động. Hướng vào QR cần cấp.');
  }catch(e){scanning=false;reader=null;$('start').disabled=false;$('stop').disabled=true;setStatus('Không mở được camera: '+(e.message||e),'warn')}
  finally{cameraStarting=false}
}
async function stopCamera(){
  if(reader){try{if(scanning)await reader.stop()}catch(e){};try{reader.clear()}catch(e){}}
  reader=null;scanning=false;cameraStarting=false;$('start').disabled=false;$('stop').disabled=true;
}
$('start').onclick=startCamera;
$('stop').onclick=()=>stopCamera().then(()=>setStatus('Đã dừng camera.'));
async function ensureVideo(){
  if(videoRecovering||pending||busy||request||!scanning||liveVideo())return;
  videoRecovering=true;
  try{await stopCamera();await new Promise(r=>setTimeout(r,500));await startCamera()}
  finally{videoRecovering=false}
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)setTimeout(ensureVideo,600)});
setInterval(()=>{if(!document.hidden)ensureVideo()},4000);
function choose(value){
  const ma=String(value||'').trim();
  if(!validCode(ma)){setStatus('Mã QR chỉ được gồm chữ và số (tối đa 100 ký tự).','warn');return}
  if(pending||busy||request)return;
  if(suppressLast&&ma===lastHandledCode)return;
  if(ma!==lastHandledCode)suppressLast=false;
  pending=ma;$('chosenDc').textContent=dc;$('chosenCode').textContent=ma;
  $('confirm').style.display='block';$('save').disabled=false;$('cancel').disabled=false;
  $('recheck').style.display='none';$('abandon').style.display='none';draw();
  setStatus('Đã đọc mã '+ma+'. Kiểm tra dây chuyền và nhấn CẬP NHẬT.');
  $('confirm').scrollIntoView({block:'center',behavior:'smooth'});
}
$('manualGo').onclick=()=>choose($('manual').value);
function clearSelection(message,kind='note'){
  const previous=pending;
  if(kind==='success'||kind==='warn-duplicate'){lastHandledCode=previous;suppressLast=true}
  pending='';busy=false;request=null;
  $('confirm').style.display='none';$('manual').value='';draw();
  setStatus(message,kind==='warn-duplicate'?'warn':kind);
  if(scanning&&liveVideo())$('reader').scrollIntoView({block:'center',behavior:'smooth'});
  else if(scanning)ensureVideo();
}
function submitPost(data){
  const form=document.createElement('form');form.method='POST';form.action=WEB_APP_URL;
  form.target='qrPostFrame';form.style.display='none';
  for(const [key,value] of Object.entries(data)){
    const input=document.createElement('input');input.name=key;input.value=String(value);form.appendChild(input);
  }
  document.body.appendChild(form);form.submit();form.remove();
}
function closeOutcome(req,result){
  if(!request||request.id!==req.id||req.phase==='done')return false;
  if(result&&result.found&&result.id===req.id&&result.ma===req.ma&&result.dc===req.dc){
    req.phase='done';clearSelection('ĐÃ GHI NHẬN THÀNH CÔNG — '+req.ma+' / '+req.dc,'success');return true;
  }
  if(result&&result.ok===true&&result.id===req.id&&result.ma===req.ma&&result.dc===req.dc){
    req.phase='done';clearSelection('ĐÃ GHI NHẬN THÀNH CÔNG — '+req.ma+' / '+req.dc,'success');return true;
  }
  if(result&&result.trung===true&&result.ma===req.ma){
    req.phase='done';clearSelection('MÃ ĐÃ CẤP — '+req.ma+' / '+(result.dc||'không rõ')+'\nNgười xuất: '+(result.nguoi||'không rõ')+'\nThời gian: '+(result.thoigian||'không rõ')+'\nKhông ghi thêm dữ liệu. Hãy quét mã khác.','warn-duplicate');return true;
  }
  if(result&&result.error){uncertain(req,'Máy chủ báo lỗi: '+result.error);return true}
  return false;
}
function uncertain(req,reason){
  if(!request||request.id!==req.id)return;
  req.phase='uncertain';busy=false;draw();
  $('save').disabled=true;$('cancel').disabled=true;
  $('recheck').style.display='block';$('abandon').style.display='block';
  setStatus('CHƯA XÁC MINH GIAO DỊCH '+req.ma+' / '+req.dc+'.\n'+reason+'\nKhông bấm CẬP NHẬT lần nữa. Kiểm tra Google Sheets hoặc nhấn KIỂM TRA LẠI (không gửi lệnh ghi).','warn');
}
async function poll(req,limitMs){
  const started=Date.now();let lastError='';
  while(request&&request.id===req.id&&req.phase==='checking'&&Date.now()-started<limitMs){
    try{
      const result=await jsonp('check',{id:req.id,ma:req.ma},9000);
      if(!request||request.id!==req.id)return;
      if(closeOutcome(req,result))return;
    }catch(e){lastError=String(e.message||e)}
    if(request&&req.phase==='checking')await new Promise(r=>setTimeout(r,2000));
  }
  if(request&&request.id===req.id&&req.phase==='checking')
    uncertain(req,'Không nhận được xác nhận hợp lệ trong thời gian chờ.'+(lastError?' Chi tiết: '+lastError:''));
}
$('save').onclick=async()=>{
  if(!pending||busy||request)return;
  if(!ready){setStatus('Máy chủ chưa sẵn sàng. Nhấn KIỂM TRA KẾT NỐI trước khi cập nhật.','warn');return}
  const person=$('person').value.trim();
  if(!person||person.length>100||/[\x00-\x1f]/.test(person)){setStatus('Vui lòng nhập tên người xuất hợp lệ.','warn');$('person').focus();return}
  localStorage.setItem('qr_person',person);
  const id=crypto.randomUUID?crypto.randomUUID():'tx-'+Date.now()+'-'+Math.random().toString(36).slice(2);
  const req={id,ma:pending,dc,phase:'checking'};
  request=req;busy=true;draw();$('save').disabled=true;$('cancel').disabled=true;
  setStatus('Đang gửi và chờ máy chủ xác nhận mã '+pending+'...','wait');
  try{submitPost({id,nonce:id,ma:pending,dc,nguoi:person})}
  catch(e){uncertain(req,'Không gửi được yêu cầu: '+(e.message||e));return}
  await new Promise(r=>setTimeout(r,1800));
  poll(req,36000);
};
window.addEventListener('message',event=>{
  if(!request||!event.origin||!/^https:\/\/(?:script\.google\.com|[a-z0-9-]+\.googleusercontent\.com)$/.test(event.origin))return;
  const data=event.data;
  if(!data||data.type!=='CAP_NGUYEN_LIEU_RESULT'||data.nonce!==request.id)return;
  closeOutcome(request,data.result);
});
$('cancel').onclick=()=>{
  if(request)return;
  clearSelection('Đã bỏ qua mã, sẵn sàng quét mã khác.');
};
$('recheck').onclick=async()=>{
  if(!request||request.phase!=='uncertain')return;
  const req=request;req.phase='checking';busy=true;draw();
  $('recheck').style.display='none';$('abandon').style.display='none';
  setStatus('Đang kiểm tra lại giao dịch cũ (không gửi lệnh ghi)...','wait');
  poll(req,18000);
};
$('abandon').onclick=()=>{
  if(!request||request.phase!=='uncertain')return;
  if(!window.confirm('Chỉ đóng sau khi đã kiểm tra Google Sheets. Không gửi lại giao dịch cũ. Tiếp tục?'))return;
  const ma=request.ma;lastHandledCode=ma;suppressLast=true;
  clearSelection('Đã đóng giao dịch chưa xác minh sau khi kiểm tra Sheets.','warn');
};
ping();
</script>
</body></html>
